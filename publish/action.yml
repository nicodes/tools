name: Publish native release packet
description: Upload exact OCI image and static artifacts after clean same-run build and complete test receipt admission
inputs:
  project:
    description: Application identity
    required: true
  revision:
    description: Full tested source commit
    required: true
  directory:
    description: Closed immutable release packet
    default: .artifacts/release
  test-evidence-directory:
    description: Same-run build and test receipts
    default: .artifacts/verification
  registry-user:
    description: Registry username
    required: true
  registry-token:
    description: Registry credential; used only in memory for exact OCI Distribution requests
    required: true
runs:
  using: composite
  steps:
    - name: Publish exact accepted packet
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        REVISION: ${{ inputs.revision }}
        DIRECTORY: ${{ inputs.directory }}
        TEST_EVIDENCE: ${{ inputs.test-evidence-directory }}
        KOMIZO_REGISTRY_USER: ${{ inputs.registry-user }}
        KOMIZO_REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: python3 -I -B "$GITHUB_ACTION_PATH/../helpers/release.py" publish --project "$PROJECT" --revision "$REVISION" --directory "$DIRECTORY" --test-evidence-directory "$TEST_EVIDENCE"
