[package]
name = "httpcontract"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = "=0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
