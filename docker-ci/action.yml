name: Prepare disposable image build environment
description: Shared mirror-aware Docker setup and compiler caches for explicit image recipes
runs:
  using: composite
  steps:
    - name: Select declared image capability
      id: plan
      shell: bash
      run: |
        python3 - <<'PY'
        import os, tomllib
        from pathlib import Path
        config = tomllib.loads(Path('cookbook.toml').read_text())
        enabled = bool(config.get('components', {}).get('images'))
        enabled &= not os.environ.get('GODOT_ENTRY', '').startswith('unit-')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('enabled=' + str(enabled).lower() + '\n')
        PY
    - name: Configure public Docker Hub mirror without inherited credentials
      if: steps.plan.outputs.enabled == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../helpers/ci-registry-mirror.sh"
      timeout-minutes: 2
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      id: builder
      if: steps.plan.outputs.enabled == 'true'
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
    - name: Select job-owned image and compiler caches
      if: steps.plan.outputs.enabled == 'true'
      shell: bash
      env:
        BUILDER_NAME: ${{ steps.builder.outputs.name }}
      run: |
        printf 'BUILDX_BUILDER=%s\n' "$BUILDER_NAME" >> "$GITHUB_ENV"
        printf 'FLEET_WEB_CACHE=%s/fleet-webcompiler\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'FLEET_BUILDKIT_CACHE=%s/fleet-buildkit\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        printf 'GOCACHE=%s/fleet-go-compiler\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: steps.plan.outputs.enabled == 'true'
      with:
        path: |
          ${{ runner.temp }}/fleet-webcompiler/*/metro-cache
          ${{ runner.temp }}/fleet-webcompiler/*/state.json
        key: cookbook-web-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/package.json', '**/bun.lock', '**/package-lock.json') }}-${{ github.sha }}
        restore-keys: cookbook-web-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/package.json', '**/bun.lock', '**/package-lock.json') }}-
      timeout-minutes: 10
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: steps.plan.outputs.enabled == 'true'
      with:
        path: ${{ runner.temp }}/fleet-buildkit
        key: cookbook-layers-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/Cargo.lock', '**/go.sum', '**/Dockerfile', '**/package.json', '**/bun.lock', '**/package-lock.json') }}-${{ github.sha }}
        restore-keys: cookbook-layers-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/Cargo.lock', '**/go.sum', '**/Dockerfile', '**/package.json', '**/bun.lock', '**/package-lock.json') }}-
      timeout-minutes: 10
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: steps.plan.outputs.enabled == 'true'
      with:
        path: ${{ runner.temp }}/fleet-go-compiler
        key: cookbook-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/go.mod', '**/go.sum') }}-${{ github.sha }}
        restore-keys: cookbook-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/go.mod', '**/go.sum') }}-
      timeout-minutes: 10
