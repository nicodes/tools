name: "Set up"
description: Install caller-owned mise tools and expose helpers from the pinned action source
inputs:
  directory:
    description: Directory containing the caller's mise configuration
    default: .
    required: false
  tools:
    description: Optional space-separated tool identifiers to install from the caller pins; empty installs all declared tools
    default: ''
    required: false
runs:
  using: composite
  steps:
    - name: Select reviewed SDK binary
      id: mise
      shell: bash
      env:
        SDK_OS: ${{ runner.os }}
        SDK_ARCH: ${{ runner.arch }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../helpers/mise-platform.py" --os "$SDK_OS" --arch "$SDK_ARCH" >> "$GITHUB_OUTPUT"
        python3 -c 'import sys; print("bootstrap-python=" + str(sys.version_info < (3, 11)).lower())' >> "$GITHUB_OUTPUT"
    - name: Bootstrap the SDK configuration parser
      if: steps.mise.outputs.bootstrap-python == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.13.11'
        check-latest: false
    - name: Validate selected caller tools
      if: inputs.tools != ''
      shell: bash
      env:
        CALLER_DIRECTORY: ${{ inputs.directory }}
        CALLER_TOOLS: ${{ inputs.tools }}
      run: python3 "$GITHUB_ACTION_PATH/../helpers/select-tools.py" --directory "$CALLER_DIRECTORY" --tools "$CALLER_TOOLS"
    - name: "Set up tools"
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
      with:
        version: ${{ steps.mise.outputs.version }}
        working_directory: ${{ inputs.directory }}
        install_args: ${{ inputs.tools }}
        sha256: ${{ steps.mise.outputs.sha256 }}
    - name: Prepare the reviewed Windows Make task runner
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MISE_AUTO_INSTALL: 'false'
        MISE_EXEC_AUTO_INSTALL: 'false'
      run: python3 "$env:GITHUB_ACTION_PATH/../helpers/make-setup.py"
    - name: Select reviewed CI helpers
      shell: bash
      env:
        TOOLS_SOURCE: ${{ github.action_ref || github.sha }}
        TOOLS_ACTION: ${{ github.action_path }}
      run: |
        set -euo pipefail
        [[ "$TOOLS_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo 'Pin tools/setup to a full source commit' >&2; exit 1; }
        printf 'TOOLS_ROOT=%s\n' "$(cd "$TOOLS_ACTION/.." && pwd -P)" >> "$GITHUB_ENV"
        printf '%s\n' 'MISE_AUTO_INSTALL=false' 'MISE_EXEC_AUTO_INSTALL=false' >> "$GITHUB_ENV"
