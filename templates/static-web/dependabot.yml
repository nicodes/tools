# Keeps the pinned `uses:` refs in .github/workflows and .github/actions
# current.
#
# Every third-party action here is pinned to a commit SHA rather than a tag,
# which is the point: a tag is a moving reference, and whoever can move it
# can run code in these jobs. The cost of a SHA is that nothing tells you
# when it has gone stale -- a tag at least reads as a version. This is the
# thing that tells you.
#
# No groups: every update arrives as one reviewable pull request of its own.
# The shared merge gate rejects grouped updates, so grouping would only
# defer work to a human that the gate would have merged ungated.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
