# Individual updates preserve the review boundary. The workflow rejects grouped,
# sensitive, major and pre-1.0 minor changes even if grouping is added later.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/images
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /pb
    schedule:
      interval: weekly
