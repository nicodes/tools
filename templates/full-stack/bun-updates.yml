name: Bun updates
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bun-updates
  cancel-in-progress: false
jobs:
  update:
    name: Bun updates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        timeout-minutes: 15
      - run: python3 scripts/engineering/helpers/update-bun.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
      - name: Retain the update inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-updates
          path: .artifacts/bun-updates.json
          if-no-files-found: ignore
          retention-days: 30
        timeout-minutes: 5
      - if: failure()
        run: python3 scripts/engineering/helpers/report-failure.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 3
