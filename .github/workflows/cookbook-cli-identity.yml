name: Select CLI release identity
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      bump:
        type: string
        required: true
    outputs:
      version:
        description: Exact native executable version
        value: ${{ jobs.identity.outputs.version }}
      tag:
        description: New immutable release tag
        value: ${{ jobs.identity.outputs.tag }}
      date:
        description: Exact common native build timestamp
        value: ${{ jobs.identity.outputs.date }}
permissions: {}
jobs:
  identity:
    name: Select immutable release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      date: ${{ steps.identity.outputs.date }}
    env:
      COOKBOOK_SHA: ${{ inputs.tools-ref }}
      RELEASE_BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted immutable cookbook and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/tools/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out accepted cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: ${{ inputs.tools-ref }}
          path: _cookbook
          persist-credentials: false
      - name: Bootstrap caller-pinned Python
        uses: ./_cookbook/setup
        with:
          tools: python
      - name: Select unused native release identity without mutation
        id: identity
        run: python3 _cookbook/cookbook/cli_release.py identity --source "$GITHUB_SHA" --tools "$COOKBOOK_SHA" --bump "$RELEASE_BUMP"
