name: Composite runtime admission
'on':
  pull_request:
    paths:
      - podman-ci/**
      - helpers/composite-actions.py
      - .github/workflows/composite-runtime.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  load:
    name: Load the native Podman composite on Ubuntu 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./setup
        with:
          tools: python
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Admit every composite step before evaluating optional capability conditions
        uses: ./podman-ci
