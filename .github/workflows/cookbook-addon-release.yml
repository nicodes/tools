name: Release Godot addon
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      bump:
        type: string
        required: true
    secrets:
      gdam-key:
        required: true
permissions: {}
jobs:
  validate:
    name: Validate release source
    permissions:
      contents: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ github.sha }}
      mode: full
      release-bump: ${{ inputs.bump }}
  publish:
    name: Publish accepted addon
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: ${{ inputs.tools-ref }}
          path: .artifacts/cookbook-source
          persist-credentials: false
      - name: Download this run's accepted bytes and evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Publish immutable release from accepted bytes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .artifacts/cookbook-source/cookbook/publication.py publish --bump "$BUMP"
      - name: Publish addon registry entry
        uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
        with:
          tag: ${{ steps.release.outputs.tag }}
          asset: ${{ steps.release.outputs.asset }}
          api-key: ${{ secrets.gdam-key }}
