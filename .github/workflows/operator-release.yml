name: Release operator
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        default: patch
        options: [patch, minor, major]
permissions: {}
concurrency: operator-release
jobs:
  release:
    name: "Release"
    uses: ./.github/workflows/cli-release.yml
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      tools-ref: ${{ github.sha }}
      binary: tools-operator
      main-package: ./cmd/tools-operator
      module-directory: operator
      version-symbol: main.version
      tag-prefix: operator-v
      check-command: make check && sudo /usr/bin/python3 tests/native_operator_boot.py
      bump: ${{ inputs.bump }}
