name: Vulnerability scan
# Deployed-image scan. Callers grant contents, packages and deployments read
# plus issues write. Under-granted callers fail before jobs start.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label selected by the caller
        type: string
        required: false
        default: ubuntu-24.04
      scan-config:
        description: Caller-owned deployed-image scan manifest
        required: false
        type: string
        default: deploy/scan.json
permissions:
  contents: read
  packages: read
  deployments: read
jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 110
    permissions:
      contents: read
      packages: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        timeout-minutes: 10
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
        timeout-minutes: 3
      - name: Resolve the caller's pinned engineering snapshot
        run: |
          set -euo pipefail
          source scripts/engineering-env.sh
          echo "CICD_ENGINEERING=$CICD_ENGINEERING" >> "$GITHUB_ENV"
      - name: Scan every source module
        timeout-minutes: 30
        run: make vuln
      - name: Scan deployed runtime images
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_CONFIG: ${{ inputs.scan-config }}
        run: python3 "$CICD_ENGINEERING/helpers/scan-deployed.py" --config "$SCAN_CONFIG"

  report:
    name: Report failure
    needs:
      - scan
    if: failure()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 11
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the shared report helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nicodes/tools
          ref: 9048c13d8ade9c0005233b939749afbb7b059ff2 # v0.11.1 source
          path: .cicd
          persist-credentials: false
          sparse-checkout: helpers/
        timeout-minutes: 3
      - run: python3 .cicd/helpers/report-failure.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 3
