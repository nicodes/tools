name: Maintenance
on:
  schedule:
  - cron: 31 11 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  dependencies:
    name: "Check dependencies"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      issues: write
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up tools
      uses: ./setup
      timeout-minutes: 5
    - name: Check versions
      run: python3 helpers/watch-tools.py
      env:
        GH_TOKEN: ${{ github.token }}
