name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 helpers/integration-identity.py
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Check libraries
      run: make check
    - name: Verify standalone CLI build and release preparation
      run: python3 tests/standalone_release.py
    - name: Verify operator boot directories
      run: sudo /usr/bin/python3 tests/native_operator_boot.py
