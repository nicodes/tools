name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-operator:
    name: "Build native operator"
    uses: ./.github/workflows/operator-native.yml
  test:
    name: Test
    needs: native-operator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: "Set up tools"
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 helpers/integration-identity.py
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: "Download artifacts"
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: operator-native-*
        path: .artifacts/native-operator
        merge-multiple: true
    - name: Verify complete native operator set
      run: python3 scripts/operator_package.py assemble
    - name: Prepare pinned Godot for real native import controls
      timeout-minutes: 5
      run: |
        python3 helpers/godot-setup.py --version 4.7.2 --expected-version 4.7.2.stable.official.ed1daf0bf --binary-checksum sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 --origin godot-builds --root .artifacts/native-test-godot
        printf 'GODOT_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-godot/bin/godot" >> "$GITHUB_ENV"
        python3 tests/test_godot_host_templates.py --prepare .artifacts/native-host-template-fixture .artifacts/native-test-godot/archives
        printf 'GODOT_HOST_TEMPLATE_CACHE=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-host-template-fixture" >> "$GITHUB_ENV"
    - name: Prepare pinned native addon CLI and display for real controls
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .artifacts/native-test-gdam
        gh release download v0.2.0 --repo aviorstudio/gdam --pattern gdam_Linux_x86_64.tar.gz --dir .artifacts/native-test-gdam
        echo '46a743c8e0380eee44f757b52b4a968e59aac6470478078f40d06a33569bf4dd  .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz' | sha256sum --check
        tar -xzf .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz -C .artifacts/native-test-gdam
        printf 'GDAM_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-gdam/gdam" >> "$GITHUB_ENV"
        command -v xvfb-run
        command -v Xvfb
        command -v xauth
    - name: Prepare pinned scanner for offline native image controls
      timeout-minutes: 5
      run: |
        python3 tests/native_image_security_control.py setup --directory "$RUNNER_TEMP/native-image-security"
        printf 'TOOLS_NATIVE_IMAGE_SECURITY_ROOT=%s\n' "$RUNNER_TEMP/native-image-security" >> "$GITHUB_ENV"
    - name: Check libraries and disposable recovery
      run: mise run check
    - name: Verify isolated classic image-cache reset
      timeout-minutes: 5
      run: sudo /usr/bin/python3 tests/native_image_cache_control.py
    - name: Verify locked upstream Caddy build and linked symbols
      run: python3 helpers/test-caddy.py
    - name: Verify standalone CLI build and release preparation
      run: python3 tests/standalone_release.py
    - name: Verify operator boot directories
      run: sudo /usr/bin/python3 tests/native_operator_boot.py
