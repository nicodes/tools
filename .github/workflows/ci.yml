name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-operator:
    name: Native operator
    uses: ./.github/workflows/operator-native.yml
  test:
    name: Test
    needs: native-operator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: "Set up tools"
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 helpers/integration-identity.py
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Download native operator archives
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: operator-native-*
        path: .artifacts/native-operator
        merge-multiple: true
    - name: Verify complete native operator set
      run: python3 scripts/operator_package.py assemble
    - name: Check libraries
      run: make check
    - name: Verify locked upstream Caddy build and linked symbols
      run: python3 helpers/test-caddy.py
    - name: Verify disposable PostgreSQL recovery
      run: make integration
    - name: Verify standalone CLI build and release preparation
      run: python3 tests/standalone_release.py
    - name: Verify operator boot directories
      run: sudo /usr/bin/python3 tests/native_operator_boot.py
