name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-postgres:
    name: Source-built PostgreSQL runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare native Podman
      uses: ./podman-ci
    - name: Build, scan and exercise the exact shared constructor
      timeout-minutes: 32
      run: sudo -n /usr/bin/python3 -I -B tests/native_postgres_runtime.py --directory "$RUNNER_TEMP/postgres-runtime-native" --revision "$GITHUB_SHA"
    - name: Retain finite native runtime evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: postgres-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/postgres-runtime-proof/proof.json
          .artifacts/postgres-runtime-proof/su-exec-image.json
          .artifacts/postgres-runtime-proof/security.json
          .artifacts/postgres-runtime-proof/sbom.json
          .artifacts/postgres-runtime-proof/scan-context.json
          .artifacts/postgres-runtime-proof/error.json
        if-no-files-found: error
        retention-days: 7
  snapshot-crypto:
    name: Large snapshot cryptography
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Authenticate more than two GiB under finite kernel limits
      timeout-minutes: 27
      run: /usr/bin/python3 -I -B tests/native_snapshot_crypto.py
    - name: Retain bounded resource evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: snapshot-crypto-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/snapshot-bulk.json
        if-no-files-found: error
        retention-days: 7
  native-operator:
    name: "Build native operator"
    uses: ./.github/workflows/operator-native.yml
  test:
    name: Test
    needs: native-operator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare the private artifact parent before SDK installers
      timeout-minutes: 1
      run: |
        python3 -I -B -c 'import runpy,sys; sys.version_info >= (3,11) or sys.exit("Private SDK preparation requires host Python 3.11 or newer"); sys.argv=["helpers/private_directory.py","prepare"]; runpy.run_path(sys.argv[0],run_name="__main__")'
        python3 -I -B helpers/rust_install_context.py --github-env
    - name: "Set up tools"
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 helpers/integration-identity.py
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: "Download artifacts"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: operator-native-*
        path: .artifacts/native-operator
        merge-multiple: true
    - name: Verify complete native operator set
      run: python3 scripts/operator_package.py assemble
    - name: Prepare pinned Godot for real native import controls
      timeout-minutes: 5
      run: |
        python3 helpers/godot-setup.py --version 4.7.2 --expected-version 4.7.2.stable.official.ed1daf0bf --binary-checksum sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 --origin godot-builds --root .artifacts/native-test-godot
        printf 'GODOT_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-godot/bin/godot" >> "$GITHUB_ENV"
    - name: Prepare pinned native addon CLI and display for real controls
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .artifacts/native-test-gdam
        gh release download v0.2.0 --repo aviorstudio/gdam --pattern gdam_Linux_x86_64.tar.gz --dir .artifacts/native-test-gdam
        echo '46a743c8e0380eee44f757b52b4a968e59aac6470478078f40d06a33569bf4dd  .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz' | sha256sum --check
        tar -xzf .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz -C .artifacts/native-test-gdam
        printf 'GDAM_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-gdam/gdam" >> "$GITHUB_ENV"
        command -v xvfb-run
        command -v Xvfb
        command -v xauth
    - name: Prepare native Podman
      uses: ./podman-ci
    - name: Prepare pinned scanner for offline native image controls
      timeout-minutes: 5
      run: |
        python3 tests/native_image_security_control.py setup --directory "$RUNNER_TEMP/native-image-security"
        printf 'TOOLS_NATIVE_IMAGE_SECURITY_ROOT=%s\n' "$RUNNER_TEMP/native-image-security" >> "$GITHUB_ENV"
    - name: Prepare locked native verification dependencies
      run: mise run setup
    - name: Check libraries and disposable recovery
      run: mise run check
    - name: Verify isolated OCI image-cache reset
      timeout-minutes: 5
      run: sudo /usr/bin/python3 tests/native_image_cache_control.py
    - name: Verify locked upstream Caddy build and linked symbols
      run: python3 helpers/test-caddy.py
    - name: Verify standalone CLI build and release preparation
      run: python3 tests/standalone_release.py
    - name: Verify operator boot directories
      run: sudo /usr/bin/python3 tests/native_operator_boot.py
