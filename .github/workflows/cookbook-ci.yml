name: Recipe CI
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      recipe:
        type: string
        default: godot-addon
      preview-environment:
        type: string
        default: ''
      preview-number:
        type: string
        default: ''
      head:
        type: string
        default: ''
      base:
        type: string
        default: ''
      merge-gate:
        type: boolean
        default: false
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 30
permissions: {}
jobs:
  fast:
    name: Fast source checks
    if: github.event_name == 'pull_request' && inputs.merge-gate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      mode: fast
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
  full:
    name: Full source checks
    if: (github.event_name != 'pull_request' || !inputs.merge-gate) && contains(fromJSON('["godot-addon","react-native"]'), inputs.recipe)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      mode: full
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
      preview-environment: ${{ inputs.recipe == 'react-native' && (github.event_name == 'pull_request' || inputs.head != '') && inputs.preview-environment || '' }}
      preview-number: ${{ inputs.preview-number }}
  native:
    name: Native source checks
    if: (github.event_name != 'pull_request' || !inputs.merge-gate) && inputs.recipe == 'rust-cli'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cookbook-native.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
  godot:
    name: Godot source checks
    if: (github.event_name != 'pull_request' || !inputs.merge-gate) && inputs.recipe == 'godot-game'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cookbook-godot.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
  unsupported:
    name: Require implemented recipe orchestration
    if: (github.event_name != 'pull_request' || !inputs.merge-gate) && !contains(fromJSON('["godot-addon","react-native","rust-cli","godot-game"]'), inputs.recipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'Complete orchestration for this recipe is not enrolled yet'; exit 1
