name: Recipe CI
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      merge-gate:
        type: boolean
        default: false
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 30
permissions: {}
jobs:
  fast:
    name: Fast source checks
    if: github.event_name == 'pull_request' && inputs.merge-gate
    permissions:
      contents: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      mode: fast
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
  full:
    name: Full source checks
    if: github.event_name != 'pull_request' || !inputs.merge-gate
    permissions:
      contents: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      tools-ref: ${{ inputs.tools-ref }}
      source: ${{ inputs.source }}
      mode: full
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
