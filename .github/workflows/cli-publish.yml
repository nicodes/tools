name: Publish CLI
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      binary:
        type: string
        required: true
      extra-files:
        type: string
        required: false
        default: ''
      artifact-id:
        type: string
        required: true
      tag:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: linux,darwin
    outputs:
      url:
        description: Published release URL
        value: ${{ jobs.publish.outputs.url }}
permissions: {}
jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
    - name: Validate source and tools identity
      env:
        TOOLS_REF: ${{ inputs.tools-ref }}
      run: |-
        set -euo pipefail
        [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
    - name: "Check out source"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        path: _cli_tools
        persist-credentials: false
    - name: "Download artifacts"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: release-assets
    - name: Publish verified binaries
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
        BINARY: ${{ inputs.binary }}
        TAG: ${{ inputs.tag }}
        EXTRA_FILES: ${{ inputs.extra-files }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |-
        set -euo pipefail
        python3 _cli_tools/scripts/cli_release.py publish --binary "$BINARY" --tag "$TAG" \
          --source "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --extra-files "$EXTRA_FILES" --platforms "$PLATFORMS"
        printf 'url=https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_OUTPUT"
