name: Cookbook validation
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      mode:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 30
      runner:
        type: string
        default: ubuntu-24.04
      preview-environment:
        type: string
        default: ''
      preview-number:
        type: string
        default: ''
      release-bump:
        type: string
        default: ''
      head:
        type: string
        default: ''
      base:
        type: string
        default: ''
permissions: {}
jobs:
  validate:
    name: Make ${{ inputs.mode }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.mode == 'full' && inputs.preview-environment == 'Preview' && (github.event_name == 'pull_request' || (inputs.head != '' && inputs.base != '')) && 'Preview' || '' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      COOKBOOK_PREVIEW_CLERK_KEY: ${{ inputs.mode == 'full' && inputs.preview-environment == 'Preview' && vars.CLERK_PUBLISHABLE_KEY || '' }}
      COOKBOOK_PREVIEW_NUMBER: ${{ inputs.preview-number }}
      COOKBOOK_VALIDATION_TIMEOUT: ${{ inputs.timeout-minutes }}
      SOURCE_SHA: ${{ inputs.source }}
      COOKBOOK_SHA: ${{ inputs.tools-ref }}
      COOKBOOK_MODE: ${{ inputs.mode }}
      RELEASE_BUMP: ${{ inputs.release-bump }}
      REQUEST_HEAD: ${{ inputs.head }}
      REQUEST_BASE: ${{ inputs.base }}
      COOKBOOK_CANDIDATE_COMMIT: ${{ inputs.head || github.event.pull_request.head.sha || inputs.source }}
      REQUIRE_CLEAN_HISTORY: ${{ !github.event.repository.private }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable source and accepted cookbook identities
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ENVIRONMENT: ${{ inputs.preview-environment }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$PREVIEW_ENVIRONMENT" || ( "$PREVIEW_ENVIRONMENT" == Preview && "$COOKBOOK_MODE" == full && ( "$GITHUB_EVENT_NAME" == pull_request || ( -n "$REQUEST_HEAD" && -n "$REQUEST_BASE" ) ) ) ]]
          if [[ -n "$COOKBOOK_PREVIEW_NUMBER" ]]; then
            [[ "$COOKBOOK_PREVIEW_NUMBER" =~ ^[1-9][0-9]{0,9}$ && "$PREVIEW_ENVIRONMENT" == Preview && "$COOKBOOK_MODE" == full ]]
            [[ "$SOURCE_SHA" == "$REQUEST_HEAD" && "$REQUEST_HEAD" =~ ^[a-f0-9]{40}$ && "$REQUEST_BASE" =~ ^[a-f0-9]{40}$ ]]
            [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/pr-preview.yml@refs/heads/main" ]]
            [[ "$GITHUB_EVENT_NAME" == pull_request_target || "$GITHUB_EVENT_NAME" == issue_comment ]]
          fi
          case "$COOKBOOK_MODE" in fast|full) ;; *) exit 1 ;; esac
          relation="$(gh api "repos/nicodes/tools/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Preserve Git source line endings
        run: git config --global core.autocrlf false
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: ${{ inputs.tools-ref }}
          path: _cookbook
          persist-credentials: false
      - name: Keep the checkout-local cookbook outside source and engine imports
        run: |
          printf '/_cookbook/\n' >> "$(git rev-parse --git-path info/exclude)"
          python3 -c 'from pathlib import Path; Path("_cookbook/.gdignore").touch()'
      - name: Bootstrap pinned Python for protected Windows output directories
        if: runner.os == 'Windows'
        uses: ./_cookbook/setup
        with:
          tools: python
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create protected checkout output root
        run: python3 -c 'from pathlib import Path; p=Path(".artifacts"); assert not p.is_symlink(); p.mkdir(mode=0o700, exist_ok=True)'
      - name: Set up pinned SDKs
        uses: ./_cookbook/setup
        with:
          tools: ${{ inputs.mode == 'fast' && 'python actionlint' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare declared image capabilities
        if: inputs.mode == 'full' && runner.os == 'Linux'
        uses: ./_cookbook/docker-ci
      - name: Restore bounded Cargo compiler intermediates
        if: inputs.mode == 'full'
        uses: ./_cookbook/compiler-cache
      - name: Read declared native diagnostic locations
        id: native-evidence
        run: python3 _cookbook/helpers/native-diagnostics.py
      - name: Run Make gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 _cookbook/cookbook/ci.py --mode "$COOKBOOK_MODE" --source "$SOURCE_SHA" --tools "$COOKBOOK_SHA" --release-bump "$RELEASE_BUMP" --head "$REQUEST_HEAD" --base "$REQUEST_BASE"
      - name: Preserve declared native outputs independently of acceptance
        if: always() && steps.native-evidence.outcome == 'success' && steps.native-evidence.outputs.paths != ''
        uses: ./_cookbook/native-diagnostics
        with:
          declaration-sha256: ${{ steps.native-evidence.outputs.declaration-sha256 }}
          job-status: ${{ job.status }}
          source: ${{ inputs.source }}
          entry: host
      - name: Preserve native diagnostics independently of acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cookbook-native-diagnostics-${{ inputs.source }}-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/godot-tests/**/output.log
            .artifacts/godot-tests/**/summary.json
            .artifacts/godot-tests/**/timings.jsonl
            .artifacts/godot-tests.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload accepted outputs and fresh evidence
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cookbook-full-${{ inputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.gate.outputs.artifact-paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Save successful bounded Cargo compiler intermediates
        if: inputs.mode == 'full'
        uses: ./_cookbook/compiler-cache
        with:
          mode: save
