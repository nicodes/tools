name: Security
on:
  schedule:
  - cron: 17 4 * * *
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: false
jobs:
  security:
    name: "Scan dependencies"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Set up tools
      uses: ./setup
      timeout-minutes: 5
    - name: Scan dependencies
      run: mise run install && mise run vuln
      env:
        GH_TOKEN: ${{ github.token }}
