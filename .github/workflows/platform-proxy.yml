name: "Platform Proxy"
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: platform-proxy
  cancel-in-progress: false
jobs:
  publish:
    name: "Publish platform proxy"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed main source
        run: test "$GITHUB_REF" = refs/heads/main
      - name: "Set up tools"
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Verify the published source
        run: make install check
        timeout-minutes: 35
      - name: Build and scan the exact platform image
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-proxy:${GITHUB_SHA}"
          mkdir -p .artifacts/platform
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f platform/proxy.Dockerfile --iidfile .artifacts/platform/image-id . -t "$image"
          python3 helpers/scan-image.py "$(cat .artifacts/platform/image-id)" --expected-go 1.27.3 > .artifacts/platform/scan.txt
          docker run --rm --network none "$image" version > .artifacts/platform/version.txt
          docker run --rm --network none "$image" list-modules --packages > .artifacts/platform/modules.txt
          echo "name=$image" >> "$GITHUB_OUTPUT"
        timeout-minutes: 25
      - name: "Log in to container registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the scanned image
        id: published
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          reference="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$reference" > .artifacts/platform/reference.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "name=${reference%@*}" >> "$GITHUB_OUTPUT"
        timeout-minutes: 5
      - name: "Attest build provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.published.outputs.name }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-proxy-${{ github.sha }}
          path: .artifacts/platform
          if-no-files-found: error
          retention-days: 90
