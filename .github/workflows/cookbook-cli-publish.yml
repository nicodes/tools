name: Publish accepted CLI release
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
      tag:
        type: string
        required: true
permissions: {}
jobs:
  publish:
    name: Publish immutable accepted native archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      COOKBOOK_SHA: ${{ inputs.tools-ref }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted immutable cookbook and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/tools/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out accepted cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: ${{ inputs.tools-ref }}
          path: _cookbook
          persist-credentials: false
      - name: Bootstrap caller-pinned Python
        uses: ./_cookbook/setup
        with:
          tools: python
      - name: Download exactly the accepted caller artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: .
          merge-multiple: true
      - name: Recheck exact source proof and publish immutable native bytes
        run: python3 _cookbook/cookbook/cli_release.py publish --source "$GITHUB_SHA" --tools "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
