name: Dependency Policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '8 6 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
concurrency:
  group: dependency-policy
  cancel-in-progress: false
jobs:
  auto-merge:
    name: Apply dependency policy
    uses: nicodes/tools/.github/workflows/dependency-merge.yml@a691deda7f5f65829194d1c6c5d952a1327d4b24 # v0.27.2
    with:
      runner: ubuntu-24.04
