name: "Reusable Build & Test"
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      build-variant:
        type: string
        default: production
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: "Install dependencies"
        run: make install
      - name: "Run source checks"
        run: make lint test vuln
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence-${{ github.sha }}
          path: .artifacts/contract
          if-no-files-found: error
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 110
    env:
      BUILD_VARIANT: ${{ inputs.build-variant }}
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: "Install dependencies"
        run: make install
      - name: "Verify build artifacts"
        run: make build artifact-check e2e
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-evidence-${{ github.sha }}
          path: .artifacts/contract
          if-no-files-found: error
