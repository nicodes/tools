name: Source dependency security
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      setup-timeout-minutes:
        type: number
        required: true
permissions: {}
jobs:
  audit:
    name: Source dependency audit
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Check out pinned dependency tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: ${{ inputs.tools-ref }}
          path: _dependency_security_tools
          persist-credentials: false
      - name: Prepare exact source audit SDK and frozen dependencies
        timeout-minutes: ${{ inputs['setup-timeout-minutes'] }}
        uses: ./_dependency_security_tools/dependency-security
        with:
          source: ${{ inputs.source }}
          tools-ref: ${{ inputs.tools-ref }}
          runner: ${{ inputs.runner }}
          timeout-minutes: ${{ inputs['timeout-minutes'] }}
          setup-timeout-minutes: ${{ inputs['setup-timeout-minutes'] }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Audit complete frozen source inventories
        run: python3 _dependency_security_tools/cookbook/dependency_security.py audit
