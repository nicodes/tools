name: Release CLI
'on':
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: true
      check-command:
        description: Product-owned verification command, run before building or publishing
        type: string
        required: true
      binary:
        type: string
        required: true
      extra-files:
        type: string
        required: false
        default: ''
      bump:
        type: string
        required: false
        default: patch
      tag-prefix:
        type: string
        required: false
        default: v
      main-package:
        type: string
        required: false
        default: .
      module-directory:
        type: string
        required: false
        default: .
      version-symbol:
        type: string
        required: false
        default: ''
      revision-symbol:
        type: string
        required: false
        default: ''
      prepared-assets:
        type: string
        required: false
        default: ''
      requested-tag:
        description: Expected computed tag for coordinated native builds
        type: string
        required: false
        default: ''
      prepared-artifact-pattern:
        description: Optional current-run native artifact names
        type: string
        required: false
        default: ''
      prepared-artifact-directory:
        type: string
        required: false
        default: .artifacts/native-cli
      platforms:
        type: string
        required: false
        default: linux,darwin
    outputs:
      tag:
        description: Published version tag
        value: ${{ jobs.build.outputs.tag }}
      url:
        description: Published release URL
        value: ${{ jobs.publish.outputs.url }}
permissions: {}
jobs:
  build:
    name: Build release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Validate release request
      env:
        TOOLS_REF: ${{ inputs.tools-ref }}
        PREPARED_PATTERN: ${{ inputs.prepared-artifact-pattern }}
        PREPARED_DIRECTORY: ${{ inputs.prepared-artifact-directory }}
        PREPARED_ASSETS: ${{ inputs.prepared-assets }}
      run: |-
        set -euo pipefail
        [[ "$TOOLS_REF" =~ ^[a-f0-9]{40}$ ]]
        if [ -n "$PREPARED_PATTERN" ]; then
          [[ "$PREPARED_PATTERN" =~ ^[A-Za-z0-9_.*-]+$ && -n "$PREPARED_ASSETS" ]]
          [[ "$PREPARED_DIRECTORY" =~ ^\.artifacts/[A-Za-z0-9_./-]+$ && "$PREPARED_DIRECTORY" != *..* ]]
        fi
        [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: "Check out source"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: ${{ inputs.tools-ref }}
        path: _cli_tools
        persist-credentials: false
    - name: Determine release version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
        PREFIX: ${{ inputs.tag-prefix }}
        REQUESTED_TAG: ${{ inputs.requested-tag }}
      run: |-
        set -euo pipefail
        printf '/_cli_tools/\n' >> .git/info/exclude
        printf 'TOOLS_ROOT=%s/_cli_tools\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        python3 _cli_tools/scripts/cli_release.py version --bump "$BUMP" --prefix "$PREFIX"
        if [ -n "$REQUESTED_TAG" ]; then
          actual="$(python3 -c 'import sys;sys.path.insert(0,"_cli_tools/scripts");import cli_release;print(cli_release.version(sys.argv[1],sys.argv[2])[1])' "$BUMP" "$PREFIX")"
          [[ "$actual" == "$REQUESTED_TAG" ]]
        fi
    - name: "Set up tools"
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
    - name: Download verified native artifacts
      if: inputs.prepared-artifact-pattern != ''
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: ${{ inputs.prepared-artifact-pattern }}
        path: ${{ inputs.prepared-artifact-directory }}
        merge-multiple: true
    - name: Check project
      env:
        CHECK_COMMAND: ${{ inputs.check-command }}
        VERSION: ${{ steps.version.outputs.tag }}
        COMMIT: ${{ github.sha }}
      run: |-
        set -euo pipefail
        test -n "$CHECK_COMMAND"
        bash -euo pipefail -c "$CHECK_COMMAND"
    - name: Build portable binaries
      if: inputs.prepared-assets == ''
      env:
        BINARY: ${{ inputs.binary }}
        TAG: ${{ steps.version.outputs.tag }}
        PACKAGE: ${{ inputs.main-package }}
        MODULE_DIR: ${{ inputs.module-directory }}
        VERSION_SYMBOL: ${{ inputs.version-symbol }}
        REVISION_SYMBOL: ${{ inputs.revision-symbol }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        python3 _cli_tools/scripts/cli_release.py build --binary "$BINARY" \
          --tag "$TAG" --source "$GITHUB_SHA" --package "$PACKAGE" --module-dir "$MODULE_DIR" \
          --version-symbol "$VERSION_SYMBOL" --revision-symbol "$REVISION_SYMBOL" --platforms "$PLATFORMS"
    - name: Select previously verified archives
      if: inputs.prepared-assets != ''
      env:
        ASSETS: ${{ inputs.prepared-assets }}
      run: |-
        set -euo pipefail
        mkdir release-assets
        shopt -s nullglob
        assets=("$ASSETS"/*.tar.gz "$ASSETS"/*.zip "$ASSETS"/checksums.txt)
        cp -- "${assets[@]}" release-assets/
    - name: Verify complete release payload
      env:
        BINARY: ${{ inputs.binary }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        python3 _cli_tools/scripts/cli_release.py validate --binary "$BINARY" --platforms "$PLATFORMS"
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: release-assets/*
    - name: "Upload artifacts"
      id: assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
        path: release-assets/
        if-no-files-found: error
        retention-days: 7
  publish:
    name: Publish release
    needs: build
    uses: ./.github/workflows/cli-publish.yml
    permissions:
      contents: write
    with:
      tools-ref: ${{ inputs.tools-ref }}
      binary: ${{ inputs.binary }}
      tag: ${{ needs.build.outputs.tag }}
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      extra-files: ${{ inputs.extra-files }}
      platforms: ${{ inputs.platforms }}
