name: Build and test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches: [main]
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      composite: ${{ steps.paths.outputs.composite }}
      ubuntu: ${{ steps.paths.outputs.ubuntu }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
    - name: Check out source and event history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Select platform self-checks from exact changed paths
      id: paths
      run: python3 .github/scripts/plan-ci.py
  native-postgres:
    name: Test PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare native Podman
      uses: ./podman-ci
    - name: Build, scan and exercise the exact shared constructor
      timeout-minutes: 32
      run: sudo -n /usr/bin/python3 -I -B tests/native_postgres_runtime.py --directory "$RUNNER_TEMP/postgres-runtime-native" --revision "$GITHUB_SHA"
    - name: Retain finite native runtime evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: postgres-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/postgres-runtime-proof/proof.json
          .artifacts/postgres-runtime-proof/su-exec-image.json
          .artifacts/postgres-runtime-proof/security.json
          .artifacts/postgres-runtime-proof/sbom.json
          .artifacts/postgres-runtime-proof/scan-context.json
          .artifacts/postgres-runtime-proof/error.json
        if-no-files-found: error
        retention-days: 7
  snapshot-crypto:
    name: Test snapshot cryptography
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Authenticate more than two GiB under finite kernel limits
      timeout-minutes: 27
      run: /usr/bin/python3 -I -B tests/native_snapshot_crypto.py
    - name: Retain bounded resource evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: snapshot-crypto-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/snapshot-bulk.json
        if-no-files-found: error
        retention-days: 7
  native-operator:
    name: Build
    uses: ./.github/workflows/build-native-operator.yml
  test:
    name: Test
    needs: native-operator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare the private artifact parent before SDK installers
      timeout-minutes: 1
      run: |
        python3 -I -B -c 'import runpy,sys; sys.version_info >= (3,11) or sys.exit("Private SDK preparation requires host Python 3.11 or newer"); sys.argv=["helpers/private_directory.py","prepare"]; runpy.run_path(sys.argv[0],run_name="__main__")'
        python3 -I -B helpers/rust_install_context.py --github-env
    - name: "Set up tools"
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: '2026.9.12'
        sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 helpers/integration-identity.py
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: "Download artifacts"
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: operator-native-*
        path: .artifacts/native-operator
        merge-multiple: true
    - name: Verify complete native operator set
      run: python3 scripts/operator_package.py assemble
    - name: Prepare pinned Godot for real native import controls
      timeout-minutes: 5
      run: |
        python3 helpers/godot-setup.py --version 4.7.2 --expected-version 4.7.2.stable.official.ed1daf0bf --binary-checksum sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 --origin godot-builds --root .artifacts/native-test-godot
        printf 'GODOT_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-godot/bin/godot" >> "$GITHUB_ENV"
    - name: Prepare pinned native addon CLI and display for real controls
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .artifacts/native-test-gdam
        gh release download v0.2.2 --repo aviorstudio/gdam --pattern gdam_Linux_x86_64.tar.gz --dir .artifacts/native-test-gdam
        echo '0c0c872e80f8de29d275c20d3173a17faf780c9800b9d5f1b627b83eee4fd2ee  .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz' | sha256sum --check
        tar -xzf .artifacts/native-test-gdam/gdam_Linux_x86_64.tar.gz -C .artifacts/native-test-gdam
        printf 'GDAM_BIN=%s\n' "$GITHUB_WORKSPACE/.artifacts/native-test-gdam/gdam" >> "$GITHUB_ENV"
        command -v xvfb-run
        command -v Xvfb
        command -v xauth
    - name: Prepare native Podman
      uses: ./podman-ci
    - name: Prepare pinned scanner for offline native image controls
      timeout-minutes: 5
      run: |
        python3 tests/native_image_security_control.py setup --directory "$RUNNER_TEMP/native-image-security"
        printf 'TOOLS_NATIVE_IMAGE_SECURITY_ROOT=%s\n' "$RUNNER_TEMP/native-image-security" >> "$GITHUB_ENV"
    - name: Prepare locked native verification dependencies
      run: mise run setup
    - name: Check libraries and disposable recovery
      run: mise run check
    - name: Verify isolated OCI image-cache reset
      timeout-minutes: 5
      run: sudo /usr/bin/python3 tests/native_image_cache_control.py
    - name: Verify locked upstream Caddy build and linked symbols
      run: python3 helpers/test-caddy.py
    - name: Verify standalone CLI build and release preparation
      run: python3 tests/standalone_release.py
    - name: Verify operator boot directories
      run: sudo /usr/bin/python3 tests/native_operator_boot.py
  composite-runtime:
    name: Test (Podman, Ubuntu 24)
    needs: plan
    if: ${{ needs.plan.outputs.composite == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up tools
        uses: ./setup
        with:
          tools: python
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Admit every composite step before evaluating optional capability conditions
        uses: ./podman-ci
      - name: Leave an actually unreadable native fixture through cache post-actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(id -u)" != 65534
          fixture="$GITHUB_WORKSPACE/.artifacts/cache-post-control"
          test ! -e "$fixture"
          install -d -m 700 "$fixture"
          sudo install -d -m 700 -o 65534 -g 65534 "$fixture/private"
          sudo install -m 600 -o 65534 -g 65534 /dev/null "$fixture/private/package.json"
          sudo install -m 600 -o 65534 -g 65534 /dev/null "$fixture/private/go.mod"
          test "$(stat -c '%u:%g:%a' "$fixture/private")" = 65534:65534:700
          test ! -r "$fixture/private/package.json"
          if LC_ALL=C find "$fixture/private" -type f > "$RUNNER_TEMP/cache-fixture.out" 2> "$RUNNER_TEMP/cache-fixture.err"; then
            echo 'Native fixture unexpectedly permits runner traversal' >&2
            exit 1
          fi
          grep -q 'Permission denied' "$RUNNER_TEMP/cache-fixture.err"
          mkdir -p "$GOCACHE" "$FLEET_WEB_CACHE/control/metro-cache"
          printf '%s\n' 'cache-post-control' > "$GOCACHE/cache-post-control"
          printf '%s\n' 'cache-post-control' > "$FLEET_WEB_CACHE/control/metro-cache/cache-post-control"
          printf '%s\n' '{"control":true}' > "$FLEET_WEB_CACHE/control/state.json"
          # The private tree deliberately survives until both actual cache
          # post-actions finish; the disposable runner owns final teardown.
  ubuntu-sdk-setup:
    name: Set up tools (Ubuntu 22)
    needs: plan
    if: ${{ needs.plan.outputs.ubuntu == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up the caller's exact Python and actionlint
        uses: ./setup
        with:
          tools: python actionlint
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the selected parser and tools
        run: |
          python3 -c 'import tomllib; assert tomllib.loads("version=1")["version"] == 1'
          python3 helpers/select-tools.py --tools 'python actionlint'
          actionlint -version
  windows-sdk-setup:
    name: Set up tools (${{ matrix.runner }})
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up exact Python and Mise
        uses: ./setup
        with:
          tools: python
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify native ACL protection and task execution
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('windows_verification', Path('helpers/verification.py'))
          verification = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verification)
          directory = verification.protected_directory(Path('.artifacts/bootstrap-control'))
          verification.protected_windows_acl(verification.windows_access(directory))
          print('Native owner and DACL validation passed')
          PY
          mise --version
      - name: Verify bounded TOML source identities
        run: python3 -m unittest discover -s tests -p test_source_config.py -v
      - name: Verify generic exact Tools source and installed SDK guards
        run: |
          python3 tests/bootstrap_shell_diagnostic.py
          python3 tests/bootstrap_transport_diagnostic.py
          python3 -m unittest discover -s tests -p test_native_shell.py -v
          python3 -m unittest discover -s tests -p test_sdk_identity.py -v
          python3 -m unittest discover -s tests -p test_sdk_bootstrap.py -v
          python3 -m unittest discover -s tests -p test_sdk_bootstrap_transport.py -v
          python3 -m unittest discover -s tests -p test_sdk_bootstrap_child.py -v
          python3 -m unittest discover -s tests -p test_pinned_tools.py -v
          python3 -m unittest discover -s tests -p test_rust_runtime_context.py -v
          python3 -m unittest discover -s tests -p test_rust_install_context.py -v
          python3 -m unittest discover -s tests -p test_private_directory.py -v
  documentation-policy:
    name: Documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event.repository.private && 1 || 0 }}
      - name: Check documentation boundary
        uses: ./documentation-policy
  build-and-test:
    name: Build and test
    if: always()
    needs: [plan, native-postgres, snapshot-crypto, native-operator, test, composite-runtime, ubuntu-sdk-setup, windows-sdk-setup, documentation-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - name: Require every selected check and reject unexpected skips
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYTHON'
        import json, os, sys
        results = json.loads(os.environ['RESULTS'])
        plan = results['plan']
        outputs = plan.get('outputs', {})
        expected = {job: True for job in ['plan', 'documentation-policy', 'native-postgres', 'snapshot-crypto', 'native-operator', 'test']}
        for job, group in [('composite-runtime', 'composite'), ('ubuntu-sdk-setup', 'ubuntu'), ('windows-sdk-setup', 'windows')]:
            expected[job] = outputs.get(group) == 'true'
        invalid = set(results) != set(expected) or set(outputs) != {'composite', 'ubuntu', 'windows'}
        invalid = invalid or any(value not in ['true', 'false'] for value in outputs.values())
        for job, required in expected.items():
            actual = results.get(job, {}).get('result')
            wanted = 'success' if required else 'skipped'
            print(job + ': ' + str(actual) + ' (required ' + wanted + ')')
            invalid = invalid or actual != wanted
        sys.exit(1 if invalid else 0)
        PYTHON
